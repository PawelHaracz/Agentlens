replicaCount: 1

image:
  repository: ghcr.io/pawelharacz/agentlens
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

clusterRole:
  create: true

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

database:
  dialect: sqlite
  sqlite:
    path: /data/agentlens.db
  postgres:
    host: ""
    port: 5432
    user: ""
    password: ""
    dbname: ""
    sslmode: prefer

auth:
  jwtSecret: ""
  existingSecret: ""
  sessionDuration: 24h

env:
  AGENTLENS_PORT: "8080"
  AGENTLENS_DATA_DIR: "/data"
  AGENTLENS_LOG_LEVEL: "info"
  AGENTLENS_KUBERNETES_ENABLED: "true"
  AGENTLENS_HEALTH_CHECK_ENABLED: "true"
  AGENTLENS_DB_DIALECT: "{{ .Values.database.dialect }}"

persistence:
  enabled: true
  storageClass: ""
  size: 1Gi
  accessMode: ReadWriteOnce

nodeSelector: {}
tolerations: []
affinity: {}
