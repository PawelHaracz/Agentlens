replicaCount: 1

image:
  repository: ghcr.io/pawelharacz/agentlens
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: agentlens.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

gateway:
  enabled: false
  gatewayName: ""
  gatewayNamespace: ""
  hostname: agentlens.example.com
  annotations: {}

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 2
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 1

topologySpreadConstraints: []
nodeSelector: {}
tolerations: []
affinity: {}

database:
  dialect: sqlite
  sqlite:
    path: /data/agentlens.db
    storageSize: 1Gi
    storageClass: ""
  external:
    host: ""
    port: 5432
    database: agentlens
    username: agentlens
    password: ""
    existingSecret: ""
    sslMode: require

postgresql:
  enabled: false
  auth:
    database: agentlens
    username: agentlens
    password: ""
    existingSecret: ""
  primary:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

metrics:
  prometheus:
    enabled: false
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    metricRelabelings: []
    relabelings: []

telemetry:
  enabled: false
  endpoint: ""
  protocol: grpc
  insecure: true
  serviceName: agentlens
  environment: production
  tracesSampler: parentbased_traceidratio
  tracesSampleRate: 1.0
  metricsInterval: 30s
  logExportLevel: info
  headers: {}

config:
  logLevel: info
  adminUsername: admin
  adminPassword: ""
  health:
    enabled: true
    interval: 30s
    timeout: 5s
    concurrency: 8
    degradedLatency: 1500ms
    failureThreshold: 3

networkPolicy:
  enabled: false
  ingressFrom: []
  egressTo: []

extraEnv: []
extraVolumes: []
extraVolumeMounts: []
