replicaCount: 1

image:
  repository: ghcr.io/pawelharacz/agentlens
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automountServiceAccountToken: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: agentlens.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

gateway:
  enabled: false
  gatewayName: ""
  gatewayNamespace: ""
  hostname: agentlens.example.com
  annotations: {}

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 2
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 1

topologySpreadConstraints: []
nodeSelector: {}
tolerations: []
affinity: {}

database:
  dialect: sqlite
  sqlite:
    path: /data/agentlens.db
    storageSize: 1Gi
    storageClass: ""
  external:
    host: ""
    port: 5432
    database: agentlens
    username: agentlens
    password: ""
    existingSecret: ""
    sslMode: require

postgresql:
  enabled: false
  auth:
    database: agentlens
    username: agentlens
    password: ""
    existingSecret: ""
  primary:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

metrics:
  prometheus:
    enabled: false
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    metricRelabelings: []
    relabelings: []

telemetry:
  enabled: false
  endpoint: ""
  frontendEndpoint: ""
  protocol: grpc
  insecure: true
  serviceName: agentlens
  environment: production
  tracesSampleRate: 1.0
  metricsInterval: 30s
  logExportLevel: info
  headers: {}

config:
  logLevel: info
  health:
    enabled: true
    interval: 30s
    timeout: 5s
    concurrency: 8
    degradedLatency: 1500ms
    failureThreshold: 3

networkPolicy:
  enabled: false
  ingressFrom: []
  egressTo: []

# MCP Discovery Server plugin settings.
# mcp.enabled=false by default (R20 — safe default for existing deployments).
mcp:
  enabled: false
  publicURL: ""
  allowedOrigins: []
  auditEnabled: true
  sessionTTL: 30m
  reaperInterval: 60s

# OIDC federation settings (Dex only in v1).
federation:
  enabled: false
  provider: "dex"
  audience: ""
  dex:
    issuer: ""
    clientID: ""
    jwksURL: ""

# Bundled Dex subchart (https://charts.dex-idp.io).
# Enable alongside federation.enabled=true for full OAuth 2.1 flow.
dex:
  enabled: false
  image:
    repository: ghcr.io/dexidp/dex
    tag: "v2.39.0"
    digest: "sha256:935ef4c1ae6537bcbdec79f5a799cf2e2a123808d45c3af7e41b77767cd3ff6f"
  config:
    issuer: "http://dex:5556/dex"
    storage:
      type: memory
    web:
      http: "0.0.0.0:5556"

extraEnv: []
extraVolumes: []
extraVolumeMounts: []
