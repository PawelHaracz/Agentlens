apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentlens.fullname" . }}
  labels:
    {{- include "agentlens.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ .Values.config.adminPassword | default (randAlphaNum 24) | b64enc | quote }}
  {{- if eq .Values.database.dialect "postgres" }}
  {{- if .Values.postgresql.enabled }}
  database-password: {{ .Values.postgresql.auth.password | default (randAlphaNum 16) | b64enc | quote }}
  {{- else if .Values.database.external.password }}
  database-password: {{ .Values.database.external.password | b64enc | quote }}
  {{- end }}
  {{- end }}
