{{- $secretName := include "agentlens.fullname" . }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "agentlens.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if eq .Values.database.dialect "postgres" }}
  {{- if .Values.postgresql.enabled }}
  {{- if .Values.postgresql.auth.password }}
  database-password: {{ .Values.postgresql.auth.password | b64enc | quote }}
  {{- else if and $existingSecret $existingSecret.data (index $existingSecret.data "database-password") }}
  database-password: {{ index $existingSecret.data "database-password" | quote }}
  {{- else }}
  database-password: {{ randAlphaNum 16 | b64enc | quote }}
  {{- end }}
  {{- else if .Values.database.external.password }}
  database-password: {{ .Values.database.external.password | b64enc | quote }}
  {{- else if and $existingSecret $existingSecret.data (index $existingSecret.data "database-password") }}
  database-password: {{ index $existingSecret.data "database-password" | quote }}
  {{- else }}
  database-password: {{ randAlphaNum 16 | b64enc | quote }}
  {{- end }}
  {{- end }}
