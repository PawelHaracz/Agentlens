apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentlens.fullname" . }}
  labels:
    {{- include "agentlens.labels" . | nindent 4 }}
data:
  config.yaml: |
    port: {{ .Values.service.port }}
    log_level: {{ .Values.config.logLevel }}
    database:
      dialect: {{ .Values.database.dialect }}
      {{- if eq .Values.database.dialect "sqlite" }}
      sqlite:
        path: {{ .Values.database.sqlite.path }}
      {{- end }}
    health_check:
      enabled: {{ .Values.config.health.enabled }}
      interval: {{ .Values.config.health.interval }}
      timeout: {{ .Values.config.health.timeout }}
      concurrency: {{ .Values.config.health.concurrency }}
      degraded_latency: {{ .Values.config.health.degradedLatency }}
      failure_threshold: {{ .Values.config.health.failureThreshold }}
    telemetry:
      enabled: {{ .Values.telemetry.enabled }}
      {{- if .Values.telemetry.endpoint }}
      endpoint: {{ .Values.telemetry.endpoint }}
      {{- end }}
      protocol: {{ .Values.telemetry.protocol }}
      insecure: {{ .Values.telemetry.insecure }}
      service_name: {{ .Values.telemetry.serviceName }}
      environment: {{ .Values.telemetry.environment }}
      traces_sample_rate: {{ .Values.telemetry.tracesSampleRate }}
      metrics_interval: {{ .Values.telemetry.metricsInterval }}
      log_export_level: {{ .Values.telemetry.logExportLevel }}
      prometheus:
        enabled: {{ .Values.metrics.prometheus.enabled }}
    mcp_server:
      enabled: {{ .Values.mcp.enabled }}
      {{- if .Values.mcp.publicURL }}
      public_url: {{ .Values.mcp.publicURL | quote }}
      {{- end }}
      {{- if .Values.mcp.allowedOrigins }}
      allowed_origins:
        {{- range .Values.mcp.allowedOrigins }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      audit_enabled: {{ .Values.mcp.auditEnabled }}
      session_ttl: {{ .Values.mcp.sessionTTL }}
      reaper_interval: {{ .Values.mcp.reaperInterval }}
    {{- if .Values.federation.enabled }}
    federation:
      enabled: true
      provider: {{ .Values.federation.provider | quote }}
      audience: {{ .Values.federation.audience | quote }}
      dex:
        issuer: {{ .Values.federation.dex.issuer | quote }}
        client_id: {{ .Values.federation.dex.clientID | quote }}
        jwks_url: {{ .Values.federation.dex.jwksURL | quote }}
    {{- end }}
