apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentlens.fullname" . }}
  labels:
    {{- include "agentlens.labels" . | nindent 4 }}
data:
  config.yaml: |
    port: 8080
    data_dir: /data
    log_level: info
    poll_interval: 5m
    kubernetes:
      enabled: true
    health_check:
      enabled: true
      interval: 30s
      timeout: 5s
      concurrency: 10
