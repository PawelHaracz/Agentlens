apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentlens.fullname" . }}
  labels:
    {{- include "agentlens.labels" . | nindent 4 }}
data:
  config.yaml: |
    port: {{ .Values.service.port }}
    log_level: {{ .Values.config.logLevel }}
    database:
      dialect: {{ .Values.database.dialect }}
      {{- if eq .Values.database.dialect "sqlite" }}
      sqlite:
        path: {{ .Values.database.sqlite.path }}
      {{- end }}
    health_check:
      enabled: {{ .Values.config.health.enabled }}
      interval: {{ .Values.config.health.interval }}
      timeout: {{ .Values.config.health.timeout }}
      concurrency: {{ .Values.config.health.concurrency }}
      degraded_latency: {{ .Values.config.health.degradedLatency }}
      failure_threshold: {{ .Values.config.health.failureThreshold }}
    telemetry:
      enabled: {{ .Values.telemetry.enabled }}
      {{- if .Values.telemetry.endpoint }}
      endpoint: {{ .Values.telemetry.endpoint }}
      {{- end }}
      protocol: {{ .Values.telemetry.protocol }}
      insecure: {{ .Values.telemetry.insecure }}
      serviceName: {{ .Values.telemetry.serviceName }}
      environment: {{ .Values.telemetry.environment }}
      tracesSampleRate: {{ .Values.telemetry.tracesSampleRate }}
      metricsInterval: {{ .Values.telemetry.metricsInterval }}
      logExportLevel: {{ .Values.telemetry.logExportLevel }}
      prometheus:
        enabled: {{ .Values.metrics.prometheus.enabled }}
