apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentlens.fullname" . }}
  labels:
    {{- include "agentlens.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentlens.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "agentlens.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "agentlens.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if and (eq .Values.database.dialect "postgres") (not .Values.postgresql.enabled) }}
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z $DB_HOST $DB_PORT; do echo waiting for postgres; sleep 2; done']
          env:
            - name: DB_HOST
              value: {{ .Values.database.external.host | quote }}
            - name: DB_PORT
              value: {{ .Values.database.external.port | quote }}
      {{- else if .Values.postgresql.enabled }}
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z $DB_HOST $DB_PORT; do echo waiting for postgres; sleep 2; done']
          env:
            - name: DB_HOST
              value: {{ printf "%s-postgresql" .Release.Name | quote }}
            - name: DB_PORT
              value: "5432"
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: AGENTLENS_PORT
              value: {{ .Values.service.port | quote }}
            - name: AGENTLENS_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: AGENTLENS_DB_DIALECT
              value: {{ .Values.database.dialect | quote }}
            {{- if eq .Values.database.dialect "sqlite" }}
            - name: AGENTLENS_DB_SQLITE_PATH
              value: {{ .Values.database.sqlite.path | quote }}
            {{- else if .Values.postgresql.enabled }}
            - name: AGENTLENS_DB_POSTGRES_HOST
              value: {{ printf "%s-postgresql" .Release.Name | quote }}
            - name: AGENTLENS_DB_POSTGRES_PORT
              value: "5432"
            - name: AGENTLENS_DB_POSTGRES_DBNAME
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: AGENTLENS_DB_POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: AGENTLENS_DB_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentlens.fullname" . }}
                  key: database-password
            {{- else }}
            - name: AGENTLENS_DB_POSTGRES_HOST
              value: {{ .Values.database.external.host | quote }}
            - name: AGENTLENS_DB_POSTGRES_PORT
              value: {{ .Values.database.external.port | quote }}
            - name: AGENTLENS_DB_POSTGRES_DBNAME
              value: {{ .Values.database.external.database | quote }}
            - name: AGENTLENS_DB_POSTGRES_USER
              value: {{ .Values.database.external.username | quote }}
            - name: AGENTLENS_DB_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentlens.fullname" . }}
                  key: database-password
            - name: AGENTLENS_DB_POSTGRES_SSLMODE
              value: {{ .Values.database.external.sslMode | quote }}
            {{- end }}
            - name: AGENTLENS_OTEL_ENABLED
              value: {{ .Values.telemetry.enabled | quote }}
            {{- if .Values.telemetry.endpoint }}
            - name: AGENTLENS_OTEL_ENDPOINT
              value: {{ .Values.telemetry.endpoint | quote }}
            {{- end }}
            - name: AGENTLENS_OTEL_PROTOCOL
              value: {{ .Values.telemetry.protocol | quote }}
            - name: AGENTLENS_OTEL_INSECURE
              value: {{ .Values.telemetry.insecure | quote }}
            {{- if or .Values.metrics.serviceMonitor.enabled .Values.metrics.prometheus.enabled }}
            - name: AGENTLENS_METRICS_PROMETHEUS_ENABLED
              value: "true"
            {{- end }}
            - name: AGENTLENS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentlens.fullname" . }}
                  key: admin-password
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/agentlens
              readOnly: true
            {{- if eq .Values.database.dialect "sqlite" }}
            - name: data
              mountPath: /data
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: {{ include "agentlens.fullname" . }}
        {{- if eq .Values.database.dialect "sqlite" }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "agentlens.fullname" . }}-data
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
