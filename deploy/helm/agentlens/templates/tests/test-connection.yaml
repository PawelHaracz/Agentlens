apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "agentlens.fullname" . }}-test"
  labels:
    {{- include "agentlens.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - |
          set -e
          wget -qO- --timeout=10 http://{{ include "agentlens.fullname" . }}:{{ .Values.service.port }}/healthz && echo "healthz OK"
          wget -qO- --timeout=10 http://{{ include "agentlens.fullname" . }}:{{ .Values.service.port }}/readyz && echo "readyz OK"
          wget -qO- --timeout=10 http://{{ include "agentlens.fullname" . }}:{{ .Values.service.port }}/api/v1/catalog && echo "catalog OK"
          echo "All tests passed!"
