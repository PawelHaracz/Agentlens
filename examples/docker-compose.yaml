services:
  agentlens:
    build: ..
    ports:
      - "8080:8080"
    environment:
      AGENTLENS_PORT: "8080"
      AGENTLENS_DATA_DIR: "/data"
      AGENTLENS_LOG_LEVEL: "info"
      AGENTLENS_HEALTH_CHECK_ENABLED: "true"
    volumes:
      - agentlens-data:/data
    depends_on:
      - a2a-agent
      - mcp-server

  a2a-agent:
    build: mock-agents/a2a-agent
    ports:
      - "9001:9001"
    environment:
      PORT: "9001"
      AGENT_NAME: "demo-a2a-agent"

  mcp-server:
    build: mock-agents/mcp-server
    ports:
      - "9002:9002"
    environment:
      PORT: "9002"
      AGENT_NAME: "demo-mcp-server"

volumes:
  agentlens-data:
