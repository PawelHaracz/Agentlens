name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      app_version:
        description: "App version override (e.g. 1.0.0). Leave empty for auto-bump."
        required: false
        type: string
      helm_version:
        description: "Helm chart version override (e.g. 1.0.0). Leave empty for auto-bump."
        required: false
        type: string

# Only one release may run at a time per branch to avoid tag conflicts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: agentlens
  HELM_CHART_PATH: deploy/helm/agentlens

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Prepare: calculate the next app and helm versions
  # ──────────────────────────────────────────────────────────────────────────
  prepare:
    name: Prepare Release Versions
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.calc.outputs.app_version }}
      helm_version: ${{ steps.calc.outputs.helm_version }}
      release_app: ${{ steps.calc.outputs.release_app }}
      release_helm: ${{ steps.calc.outputs.release_helm }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate release versions
        id: calc
        run: |
          ./scripts/calculate-versions.sh \
            ${{ inputs.app_version && format('--app-override {0}', inputs.app_version) || '' }} \
            ${{ inputs.helm_version && format('--helm-override {0}', inputs.helm_version) || '' }}

  # ──────────────────────────────────────────────────────────────────────────
  # Release Docker image
  # ──────────────────────────────────────────────────────────────────────────
  release-docker:
    name: Release Docker Image
    needs: prepare
    if: needs.prepare.outputs.release_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase registry owner
        run: echo "REGISTRY_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REGISTRY_OWNER }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.app_version }}
            ghcr.io/${{ env.REGISTRY_OWNER }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.app_version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Tag and create GitHub Release for app
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.app_version }}
          name: AgentLens v${{ needs.prepare.outputs.app_version }}
          generate_release_notes: true

  # ──────────────────────────────────────────────────────────────────────────
  # Release Helm chart (only when deploy/helm/ has changed or first release)
  # ──────────────────────────────────────────────────────────────────────────
  release-helm:
    name: Release Helm Chart
    needs: prepare
    if: needs.prepare.outputs.release_helm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Update Chart.yaml version and appVersion
        run: |
          HELM_VERSION="${{ needs.prepare.outputs.helm_version }}"
          APP_VERSION="${{ needs.prepare.outputs.app_version }}"
          sed -i "s/^version: .*/version: ${HELM_VERSION}/" "${{ env.HELM_CHART_PATH }}/Chart.yaml"
          sed -i "s/^appVersion: .*/appVersion: \"${APP_VERSION}\"/" "${{ env.HELM_CHART_PATH }}/Chart.yaml"

      - name: Lint Helm chart
        run: helm lint "${{ env.HELM_CHART_PATH }}"

      - name: Package Helm chart
        run: |
          mkdir -p ./helm-release
          helm package "${{ env.HELM_CHART_PATH }}" --destination ./helm-release

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase registry owner
        run: echo "REGISTRY_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Push Helm chart to OCI registry
        run: |
          helm push \
            "./helm-release/${{ env.IMAGE_NAME }}-${{ needs.prepare.outputs.helm_version }}.tgz" \
            "oci://ghcr.io/${{ env.REGISTRY_OWNER }}/charts"

      - name: Tag and create GitHub Release for Helm chart
        uses: softprops/action-gh-release@v2
        with:
          tag_name: helm/v${{ needs.prepare.outputs.helm_version }}
          name: Helm Chart v${{ needs.prepare.outputs.helm_version }}
          files: ./helm-release/${{ env.IMAGE_NAME }}-*.tgz
          generate_release_notes: true
