name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json

      # ── Build backend ──
      - name: Build frontend
        run: |
          cd web && npm ci
          npm run build

      - name: Build Go binary
        run: CGO_ENABLED=1 go build -o bin/agentlens ./cmd/agentlens/

      # ── Start server ──
      - name: Start AgentLens server
        id: server
        run: |
          DATA_DIR=$(mktemp -d)
          echo "data_dir=$DATA_DIR" >> "$GITHUB_OUTPUT"

          export AGENTLENS_PORT=18080
          export AGENTLENS_DATA_DIR="$DATA_DIR"
          export AGENTLENS_DB_DIALECT=sqlite
          export AGENTLENS_DB_SQLITE_PATH="$DATA_DIR/agentlens.db"
          export AGENTLENS_JWT_SECRET=e2e-ci-jwt-secret-key
          export AGENTLENS_LOG_LEVEL=warn
          export AGENTLENS_HEALTH_CHECK_ENABLED=false

          ./bin/agentlens -port 18080 > "$DATA_DIR/server.out" 2>&1 &
          echo "pid=$!" >> "$GITHUB_OUTPUT"

          # Wait for server to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:18080/healthz >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Server did not start in time"
              cat "$DATA_DIR/server.out"
              exit 1
            fi
            sleep 1
          done
          echo "Server is ready"

          # Extract admin password and mask it so it never appears in logs
          ADMIN_PW=$(grep -oP 'Password: \K.+' "$DATA_DIR/server.out" || true)
          if [ -z "$ADMIN_PW" ]; then
            echo "::error::Could not extract admin password"
            cat "$DATA_DIR/server.out"
            exit 1
          fi
          echo "::add-mask::$ADMIN_PW"
          echo "admin_password=$ADMIN_PW" >> "$GITHUB_OUTPUT"

      # ── Run Playwright tests ──
      - name: Install Playwright
        run: |
          cd e2e && npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          AGENTLENS_PORT: 18080
          AGENTLENS_ADMIN_PASSWORD: ${{ steps.server.outputs.admin_password }}
        run: cd e2e && npx playwright test

      # ── Cleanup & artifacts ──
      - name: Stop server
        if: always()
        run: kill ${{ steps.server.outputs.pid }} 2>/dev/null || true

      - name: Clean up temp data
        if: always()
        run: rm -rf "${{ steps.server.outputs.data_dir }}" 2>/dev/null || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7
