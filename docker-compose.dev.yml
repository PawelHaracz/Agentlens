# docker-compose.dev.yml — local development with AgentLens + Dex federation.
# Usage: docker-compose -f docker-compose.dev.yml up
#
# Services:
#   agentlens  - AgentLens server with MCP enabled, connected to Dex
#   dex        - Dex OIDC provider (in-memory storage, dev connectors)
#
# Dex image pinned by digest (confirmed 2026-04-18):
#   ghcr.io/dexidp/dex:v2.39.0@sha256:935ef4c1ae6537bcbdec79f5a799cf2e2a123808d45c3af7e41b77767cd3ff6f

version: "3.9"

services:
  agentlens:
    image: ghcr.io/pawelharacz/agentlens:dev
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      AGENTLENS_PORT: "8080"
      AGENTLENS_LOG_LEVEL: "debug"
      AGENTLENS_DB_DIALECT: "sqlite"
      AGENTLENS_DB_SQLITE_PATH: "/data/agentlens.db"
      # MCP Discovery Server
      AGENTLENS_MCP_ENABLED: "true"
      AGENTLENS_MCP_PUBLIC_URL: "http://localhost:8080/api/mcp"
      AGENTLENS_MCP_AUDIT_ENABLED: "true"
      AGENTLENS_MCP_SESSION_TTL: "30m"
      # Federation (Dex)
      AGENTLENS_FEDERATION_ENABLED: "true"
      AGENTLENS_FEDERATION_PROVIDER: "dex"
      AGENTLENS_FEDERATION_AUDIENCE: "http://localhost:8080/api/mcp"
      AGENTLENS_FEDERATION_DEX_ISSUER: "http://dex:5556/dex"
      AGENTLENS_FEDERATION_DEX_CLIENT_ID: "agentlens"
      AGENTLENS_FEDERATION_DEX_JWKS_URL: "http://dex:5556/dex/keys"
    volumes:
      - agentlens-data:/data
    depends_on:
      dex:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  dex:
    # Image pinned by index digest for reproducibility.
    image: "ghcr.io/dexidp/dex:v2.39.0@sha256:935ef4c1ae6537bcbdec79f5a799cf2e2a123808d45c3af7e41b77767cd3ff6f"
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "5556:5556"
    volumes:
      - ./deploy/dex/config-dev.yaml:/etc/dex/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5556/dex/healthz/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  agentlens-data:
