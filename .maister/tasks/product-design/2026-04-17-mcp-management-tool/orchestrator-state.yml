task:
  title: "MCP Management Tool for AgentLens"
  description: |
    User proposes an MCP tool that allows managing AgentLens. Three alternatives on the table:
    (1) standalone MCP server exposing AgentLens management operations,
    (2) auto-registered into the default project on startup,
    (3) generalized "MCP gateway" that wraps AgentLens REST/OpenAPI surface into MCP tools.
    User explicitly asked "co sadzisz?" — wants collaborative design exploration before implementation.
  status: completed
  tags: [mcp, management, api, plugin, openapi]
  priority: null

