  phase_summaries:
    context_synthesis:
      summary: "Codebase + MCP spec (2025-11-25) synthesized. AgentLens has no OpenAPI → gateway alternative requires OpenAPI-emission refactor first. Plugin-as-infrastructure (like plugins/health) + self-AS + self-registration into default project are all natural fits. Gateway vs hand-coded tools is the key design tension."
      sources_count: 4
    problem_exploration:
      problem_statement: "LLM apps can't natively consume AgentLens because AgentLens speaks REST, not MCP. Ship a read-only MCP discovery server in v1; strategic arc toward OpenAPI-to-MCP translator in v2."
      constraints: [spec 2025-11-25, dual auth (OAuth 2.1 + service-account API keys), principal-based multi-project auth, plugin-pattern embedded, p95<100ms, self-registration into default project]
      success_criteria: [backend app + API key works, Claude.ai Custom Connector works, p95<100ms @ 1000 entries, self-registered in UI, audit log complete]
    persona_exploration:
      personas: [Anya (backend LLM app dev, primary), Karol (IDE developer, secondary), Priya (platform operator, enabling)]
      user_journeys: [service-account-bound backend discovery, OAuth Custom Connector IDE discovery, service-account provisioning + revocation]
    idea_generation:
      alternatives_count: 22
      summary: "6 decision areas, 2-5 alternatives each, full trade-off catalog in analysis/alternatives.md"
    idea_convergence:
      selected_approach: "1C loopback + 2A parties/api_client_credentials + 3F-Dex federation + 4B-Plugin DIY wire + 5A store.Create + 6D ToolRegistry"
      trade_offs_accepted:
        - "~50 lines error-mapping glue for HTTP-to-MCP status translation"
        - "One new parties.kind enum value + api_client_credentials table (~1 week)"
        - "Runtime dependency on Dex (bundled in Helm/compose); Dex DCR spec compliance gated in Phase 6"
        - "3 weeks DIY wire protocol; in-house spec-update burden"
        - "Imperative Go self-registration (not declarative card JSON)"
        - "~50 lines speculative ToolRegistry abstraction if v2 never ships"
      key_decisions:
        - "AgentLens keeps authorization (RBAC, Parties); Dex owns authentication federation"
        - "Basic auth + service-account API keys remain parallel paths to Dex"
        - "MCP plugin completely disable-able; WireImpl interface allows library swap later"
        - "v1/v1.5/v2 arc confirmed: hand-coded → OpenAPI emission → translator"
