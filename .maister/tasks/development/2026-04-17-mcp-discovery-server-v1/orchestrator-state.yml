task:
  title: "MCP Discovery Server for AgentLens (v1)"
  description: |
    Implement the MCP Discovery Server per the product-design brief at
    .maister/tasks/product-design/2026-04-17-mcp-management-tool/.
    V1 scope: read-only MCP server embedded as plugin with 4 tools
    (agent_search, agent_get, capabilities_list, agent_card), dual auth
    (service-account API keys + OAuth 2.1 via Dex federation), principal-based
    project scoping, self-registration into default project, Streamable HTTP
    transport (spec 2025-11-25). Handoff from product-design. 8 task groups
    (A-H), ~8-9 weeks.
  status: in_progress
  tags: [mcp, discovery, plugin, auth, federation, dex, service-account]
  priority: high

