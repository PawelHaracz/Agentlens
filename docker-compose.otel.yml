version: "3.9"
services:
  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:14269/"]
      interval: 5s
      timeout: 5s
      retries: 10

  agentlens:
    build:
      context: .
      args:
        VERSION: integration-test
    ports:
      - "8080:8080"
    environment:
      AGENTLENS_OTEL_ENABLED: "true"
      AGENTLENS_OTEL_ENDPOINT: "jaeger:4317"
      AGENTLENS_OTEL_PROTOCOL: "grpc"
      AGENTLENS_OTEL_INSECURE: "true"
      AGENTLENS_OTEL_SERVICE_NAME: "agentlens"
      AGENTLENS_METRICS_PROMETHEUS_ENABLED: "true"
    depends_on:
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
