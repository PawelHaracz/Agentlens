site_name: AgentLens
site_description: AgentLens - AI Agent Observability Platform
site_url: https://agentlens.cloudtown.io/
repo_url: https://github.com/PawelHaracz/Agentlens
repo_name: PawelHaracz/Agentlens
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Architecture: architecture.md
  - API Reference: api.md
  - User Guide: user-guide.md
  - End User Guide: end-user-guide.md
  - Developer Guide: developer-guide.md
  - DevOps Guide: devops-guide.md
  - Authentication: auth.md
  - Database: database.md
  - Settings: settings.md

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
  - minify:
      minify_html: true 